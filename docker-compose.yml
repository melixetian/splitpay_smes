services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splitpay_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/app.db
    volumes:
      - ./data:/app/data
      - ./alembic/versions:/app/alembic/versions
    command: uvicorn main:app --host 0.0.0.0 --port 8000
